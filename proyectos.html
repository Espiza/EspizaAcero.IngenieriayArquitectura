<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos | Espiza Acero</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Etiqueta con la cantidad de fotos de cada proyecto (solo en esta página) */
    .galeria-item { position: relative; }
    .foto-count {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="topbar" id="topbar"></div>
<nav id="nav"></nav>

<div id="contenido"></div>

<footer id="footer"></footer>
<div class="footer-bottom" id="footer-bottom"></div>
<div class="whatsapp-widget" id="whatsapp"></div>
<button class="scroll-top" id="scrollTop" aria-label="Subir">↑</button>

<script src="js/site.js"></script>
<script src="js/menu-movil.js"></script>
<script>
  const E = window.Espiza;
  const cont = document.getElementById('contenido');

  Promise.all([E.iniciar('proyectos'), E.cargar('data/proyectos.json')]).then(([s, d]) => {
    cont.innerHTML = `
      <div class="producto-hero tema-azul">
        <h1>${E.esc(d.emoji)} ${E.esc(d.titulo)}</h1>
        <p>${E.esc(d.frase)}</p>
      </div>
      <div class="breadcrumb"><a href="index.html">Inicio</a> › Proyectos</div>
      <div class="galeria-section">
        <h2>📸 Galería de Proyectos</h2>
        <p class="subtitulo">Haz clic en un proyecto para ver todas sus fotos</p>
        <div class="galeria-grid" id="galeria"></div>
      </div>
      <div class="cta-producto">
        <h2>¿Quieres un proyecto como estos?</h2>
        <p>Contáctanos y te damos la mejor cotización</p>
        <a href="${E.esc(E.wa(d.mensaje_whatsapp))}" class="btn" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Cotizar por WhatsApp</a>
        <a href="index.html#formContacto" class="btn btn-outline" style="margin-left:10px;">✉️ Formulario de contacto</a>
      </div>`;

    const galeria = document.getElementById('galeria');
    d.proyectos.forEach((p) => {
      // Fotos del proyecto: la portada + las extras.
      // Cada extra puede ser "ruta.jpg" o { "foto": "ruta.jpg", "texto": "tu descripción" }
      const items = [{ src: p.foto, texto: p.texto || p.nombre }];
      (Array.isArray(p.fotos) ? p.fotos : []).forEach((f) => {
        if (typeof f === 'string') items.push({ src: f, texto: p.nombre });
        else if (f && f.foto) items.push({ src: f.foto, texto: f.texto || p.nombre });
      });
      const total = items.length;

      const card = document.createElement('div');
      card.className = 'galeria-item';
      card.tabIndex = 0;
      card.appendChild(E.img(p.foto, p.nombre));
      if (total > 1) {
        card.insertAdjacentHTML('beforeend', `<span class="foto-count">📷 ${total} fotos</span>`);
      }
      card.insertAdjacentHTML('beforeend', `
        <div class="galeria-item-info">
          <h4>${E.esc(p.nombre)}</h4>
          <p>${E.esc(p.descripcion)}</p>
          ${p.etiqueta ? `<span class="tag">${E.esc(p.etiqueta)}</span>` : ''}
        </div>`);

      const abrir = () => E.visor.abrir(items, 0);
      card.addEventListener('click', abrir);
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter') abrir(); });
      galeria.appendChild(card);
    });
  }).catch((e) => {
    console.error(e);
    E.errorPagina(cont, 'No se pudo cargar los proyectos.');
  });
</script>
</body>
</html>
