<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos | Espiza Acero</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="topbar" id="topbar"></div>
<nav id="nav"></nav>

<div id="contenido"></div>

<footer id="footer"></footer>
<div class="footer-bottom" id="footer-bottom"></div>
<div class="whatsapp-widget" id="whatsapp"></div>
<button class="scroll-top" id="scrollTop" aria-label="Subir">↑</button>

<script src="js/site.js"></script>
<script>
  const E = window.Espiza;
  const cont = document.getElementById('contenido');

  Promise.all([E.iniciar('proyectos'), E.cargar('data/proyectos.json')]).then(([s, d]) => {
    cont.innerHTML = `
      <div class="producto-hero tema-azul">
        <h1>${E.esc(d.emoji)} ${E.esc(d.titulo)}</h1>
        <p>${E.esc(d.frase)}</p>
      </div>
      <div class="breadcrumb"><a href="index.html">Inicio</a> › Proyectos</div>
      <div class="galeria-section">
        <h2>📸 Galería de Proyectos</h2>
        <p class="subtitulo">Haz clic en cualquier imagen para ampliarla</p>
        <div class="galeria-grid" id="galeria"></div>
      </div>
      <div class="cta-producto">
        <h2>¿Quieres un proyecto como estos?</h2>
        <p>Contáctanos y te damos la mejor cotización</p>
        <a href="${E.esc(E.wa(d.mensaje_whatsapp))}" class="btn" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Cotizar por WhatsApp</a>
        <a href="index.html#contacto" class="btn btn-outline" style="margin-left:10px;">✉️ Formulario de contacto</a>
      </div>`;

    const lista = d.proyectos.map((p) => ({ src: p.foto, texto: p.nombre }));
    const galeria = document.getElementById('galeria');
    d.proyectos.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'galeria-item';
      card.tabIndex = 0;
      card.appendChild(E.img(p.foto, p.nombre));
      card.insertAdjacentHTML('beforeend', `
        <div class="galeria-item-info">
          <h4>${E.esc(p.nombre)}</h4>
          <p>${E.esc(p.descripcion)}</p>
          ${p.etiqueta ? `<span class="tag">${E.esc(p.etiqueta)}</span>` : ''}
        </div>`);
      const abrir = () => E.visor.abrir(lista, i);
      card.addEventListener('click', abrir);
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter') abrir(); });
      galeria.appendChild(card);
    });
  }).catch((e) => {
    console.error(e);
    E.errorPagina(cont, 'No se pudo cargar los proyectos.');
  });
</script>
</body>
</html>
