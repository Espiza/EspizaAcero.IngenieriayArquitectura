backend:
  name: github
  repo: Espiza/EspizaAcero.IngenieriayArquitectura
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - file: "index.html"
        label: "Página Principal"
        name: "index"
        fields:
          - {label: "Título", name: "title", widget: "string"}